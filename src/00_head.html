<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Clase interactiva de Patrones de Diseño en Go: principios SOLID, patrones creacionales, estructurales y de comportamiento con ejemplos en Go">
    <title>Patrones de Diseño en Go - Lenguajes y Compiladores</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* ============================================================
           DESIGN SYSTEM / VARIABLES  (paleta lila, igual que /grafos)
           ============================================================ */
        :root {
            --bg-primary: #0a0a1a;
            --bg-secondary: #12122a;
            --bg-card: rgba(20, 20, 50, 0.6);
            --bg-glass: rgba(255, 255, 255, 0.05);
            --border-glass: rgba(255, 255, 255, 0.1);
            --text-primary: #e8e8f0;
            --text-secondary: #a0a0c0;
            --text-muted: #606080;
            --accent-1: #6c5ce7;
            --accent-2: #a29bfe;
            --accent-3: #00cec9;
            --accent-4: #fd79a8;
            --accent-5: #ffeaa7;
            --accent-6: #55efc4;
            --gradient-1: linear-gradient(135deg, #6c5ce7, #a29bfe);
            --gradient-2: linear-gradient(135deg, #00cec9, #55efc4);
            --gradient-3: linear-gradient(135deg, #fd79a8, #e17055);
            --gradient-4: linear-gradient(135deg, #ffeaa7, #fdcb6e);
            --gradient-5: linear-gradient(135deg, #74b9ff, #0984e3);
            --shadow-lg: 0 25px 50px rgba(0, 0, 0, 0.5);
            --shadow-glow: 0 0 30px rgba(108, 92, 231, 0.3);
            --radius: 16px;
            --radius-sm: 8px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
        }

        /* ============================================================
           ANIMATED BACKGROUND
           ============================================================ */
        .bg-effects { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
        .bg-effects .orb {
            position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.15;
            animation: orbFloat 20s ease-in-out infinite;
        }
        .bg-effects .orb:nth-child(1) { width: 600px; height: 600px; background: var(--accent-1); top: -200px; left: -200px; }
        .bg-effects .orb:nth-child(2) { width: 500px; height: 500px; background: var(--accent-3); bottom: -150px; right: -150px; animation-delay: -7s; }
        .bg-effects .orb:nth-child(3) { width: 400px; height: 400px; background: var(--accent-4); top: 50%; left: 50%; transform: translate(-50%, -50%); animation-delay: -14s; }
        @keyframes orbFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(50px, -30px) scale(1.1); }
            66% { transform: translate(-30px, 50px) scale(0.9); }
        }
        .grid-overlay {
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background-image:
                linear-gradient(rgba(108, 92, 231, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(108, 92, 231, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        /* ============================================================
           SLIDES CONTAINER
           ============================================================ */
        .slides-wrapper {
            position: relative; z-index: 1; width: 100%; height: 100%; display: flex;
            transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        .slide {
            min-width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 60px 60px 90px;   /* espacio inferior para la barra de navegación */
            position: relative;
            overflow-y: auto;
        }
        .slide > .slide-inner { margin: auto 0; }   /* centra vertical si cabe, scroll si no */
        .slide-inner { max-width: 1200px; width: 100%; }
        .slide.active .slide-inner { animation: fadeInUp 0.6s ease forwards; }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ============================================================
           TYPOGRAPHY
           ============================================================ */
        .slide-title {
            font-size: 3rem; font-weight: 800;
            background: var(--gradient-1);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            margin-bottom: 0.3em; letter-spacing: -0.02em; line-height: 1.2;
        }
        .slide-title.gradient-2 { background: var(--gradient-2); -webkit-background-clip: text; background-clip: text; }
        .slide-title.gradient-3 { background: var(--gradient-3); -webkit-background-clip: text; background-clip: text; }
        .slide-title.gradient-4 { background: var(--gradient-4); -webkit-background-clip: text; background-clip: text; }
        .slide-title.gradient-5 { background: var(--gradient-5); -webkit-background-clip: text; background-clip: text; }
        .slide-subtitle { font-size: 1.3rem; color: var(--text-secondary); font-weight: 300; margin-bottom: 1.3em; }
        h3 { font-size: 1.25rem; font-weight: 600; margin-bottom: 0.7em; color: var(--accent-2); }
        h4 { font-size: 1.05rem; font-weight: 600; margin: 0.8em 0 0.5em; color: var(--text-primary); }
        p, li { font-size: 1.02rem; line-height: 1.7; color: var(--text-secondary); }
        p + p { margin-top: 0.6em; }
        li { margin-bottom: 0.4em; }
        ul { list-style: none; padding-left: 0; }
        ul li::before { content: "▸ "; color: var(--accent-2); font-weight: bold; }
        ol { padding-left: 1.4em; }
        ol li::marker { color: var(--accent-2); font-weight: 700; }
        strong { color: var(--text-primary); font-weight: 600; }
        em { color: var(--accent-2); font-style: normal; }
        a { color: var(--accent-2); }
        code.inline, p code, li code, td code {
            font-family: 'JetBrains Mono', monospace; font-size: 0.86em;
            background: rgba(108, 92, 231, 0.15); color: #d6d0ff;
            padding: 1px 6px; border-radius: 4px;
        }

        /* ============================================================
           GLASS CARD
           ============================================================ */
        .glass-card {
            background: var(--bg-glass); border: 1px solid var(--border-glass);
            border-radius: var(--radius); padding: 22px 24px;
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            transition: var(--transition);
        }
        .glass-card:hover { border-color: rgba(108, 92, 231, 0.3); box-shadow: var(--shadow-glow); transform: translateY(-2px); }
        .cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; margin-top: 1em; }
        .cards-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 1em; }
        .cards-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 1em; }

        /* ============================================================
           CODE BLOCK  (resaltado de Go automático vía JS: data-lang="go")
           ============================================================ */
        .code-block {
            display: block;
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid var(--border-glass);
            border-left: 3px solid var(--accent-1);
            border-radius: var(--radius-sm);
            padding: 30px 20px 16px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem; line-height: 1.6;
            color: var(--text-primary);
            position: relative;
            max-height: 520px;
            overflow: auto;
            white-space: pre;
            tab-size: 4;
        }
        .code-block[data-label]::before {
            content: attr(data-label);
            position: absolute; top: 7px; right: 12px;
            font-size: 0.68rem; color: var(--accent-2);
            font-family: 'Inter', sans-serif; text-transform: uppercase; letter-spacing: 0.06em;
        }
        .code-block.bad  { border-left-color: var(--accent-4); }
        .code-block.good { border-left-color: var(--accent-6); }
        .code-block.tall { max-height: 680px; }
        .kw { color: #c792ea; }
        .tp { color: #ffcb6b; }
        .fn { color: #82aaff; }
        .st { color: #c3e88d; }
        .cm { color: #6a7a9a; font-style: italic; }
        .nb { color: #f78c6c; }
        .op { color: #89ddff; }

        /* Salida de consola */
        .output-block {
            background: #05050f;
            border: 1px solid rgba(85, 239, 196, 0.2);
            border-radius: var(--radius-sm);
            padding: 30px 18px 14px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.78rem; line-height: 1.55;
            color: var(--accent-6);
            white-space: pre; overflow-x: auto;
            position: relative;
        }
        .output-block::before {
            content: "● ● ●   $ go run .";
            position: absolute; top: 7px; left: 14px;
            font-size: 0.68rem; color: var(--text-muted); letter-spacing: 0.04em;
        }

        /* Diagrama de estructura (ASCII / UML simplificado) */
        .pseudo-code, .uml {
            background: rgba(0, 0, 0, 0.3);
            border-left: 3px solid var(--accent-1);
            padding: 16px 20px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.78rem; line-height: 1.5;
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
            color: var(--text-secondary);
            white-space: pre; overflow-x: auto;
        }
        .uml { color: #d6d0ff; border-left-color: var(--accent-2); }
        .pseudo-code .kw, .uml .kw { color: #c792ea; font-weight: 600; }

        /* ============================================================
           PATTERN COMPONENTS
           ============================================================ */
        .pattern-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 0.6em; }
        .cat-badge {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 5px 14px; border-radius: 20px;
            font-size: 0.75rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase;
        }
        .cat-badge.creacional     { background: rgba(0, 206, 201, 0.14);  color: var(--accent-3); border: 1px solid rgba(0, 206, 201, 0.3); }
        .cat-badge.estructural    { background: rgba(253, 121, 168, 0.14); color: var(--accent-4); border: 1px solid rgba(253, 121, 168, 0.3); }
        .cat-badge.comportamiento { background: rgba(255, 234, 167, 0.14); color: var(--accent-5); border: 1px solid rgba(255, 234, 167, 0.3); }
        .cat-badge.solid          { background: rgba(108, 92, 231, 0.18); color: var(--accent-2); border: 1px solid rgba(108, 92, 231, 0.35); }
        .part-badge {
            font-size: 0.72rem; color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
            border: 1px solid var(--border-glass); border-radius: 20px; padding: 4px 12px;
        }

        /* Propósito / intención del patrón */
        .intent-box {
            position: relative;
            background: linear-gradient(135deg, rgba(108, 92, 231, 0.18), rgba(162, 155, 254, 0.06));
            border: 1px solid rgba(162, 155, 254, 0.3);
            border-left: 5px solid var(--accent-1);
            border-radius: var(--radius);
            padding: 20px 24px 20px 26px;
            margin-bottom: 1.3em;
        }
        .intent-box .label {
            display: block; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.1em;
            text-transform: uppercase; color: var(--accent-2); margin-bottom: 6px;
        }
        .intent-box p { color: var(--text-primary); font-size: 1.12rem; }

        /* Problema / solución */
        .problem-card  { border-top: 3px solid var(--accent-4); }
        .solution-card { border-top: 3px solid var(--accent-6); }
        .problem-card h3  { color: var(--accent-4); }
        .solution-card h3 { color: var(--accent-6); }

        /* Analogía */
        .analogy {
            display: flex; gap: 18px; align-items: flex-start;
            background: rgba(116, 185, 255, 0.07);
            border: 1px solid rgba(116, 185, 255, 0.22);
            border-radius: var(--radius); padding: 18px 22px; margin-top: 1.2em;
        }
        .analogy .icon { font-size: 2.2rem; line-height: 1; }
        .analogy h3 { color: #74b9ff; margin-bottom: 0.3em; }

        /* Pros y contras */
        .pros-cons { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 1em; }
        .pros, .cons { border-radius: var(--radius); padding: 18px 22px; }
        .pros { background: rgba(85, 239, 196, 0.06); border: 1px solid rgba(85, 239, 196, 0.2); }
        .cons { background: rgba(253, 121, 168, 0.06); border: 1px solid rgba(253, 121, 168, 0.2); }
        .pros h3 { color: var(--accent-6); }
        .cons h3 { color: var(--accent-4); }
        .pros li::before { content: "✔ "; color: var(--accent-6); }
        .cons li::before { content: "✘ "; color: var(--accent-4); }

        /* Participantes numerados de la estructura */
        .participants { counter-reset: part; }
        .participants li { counter-increment: part; padding-left: 2.2em; position: relative; }
        .participants li::before {
            content: counter(part);
            position: absolute; left: 0; top: 2px;
            width: 1.6em; height: 1.6em; border-radius: 50%;
            background: var(--gradient-1); color: #fff;
            font-size: 0.8rem; font-weight: 700;
            display: flex; align-items: center; justify-content: center;
        }

        /* Notas específicas de Go */
        .go-tip {
            display: flex; gap: 14px; align-items: flex-start;
            background: rgba(0, 206, 201, 0.07);
            border: 1px solid rgba(0, 206, 201, 0.25);
            border-radius: var(--radius); padding: 16px 20px; margin-top: 1em;
        }
        .go-tip .icon { font-size: 1.8rem; line-height: 1; }
        .go-tip h3 { color: var(--accent-3); margin-bottom: 0.3em; font-size: 1.05rem; }

        .warn-box {
            background: rgba(255, 234, 167, 0.07);
            border: 1px solid rgba(255, 234, 167, 0.25);
            border-radius: var(--radius); padding: 16px 20px; margin-top: 1em;
        }
        .warn-box h3 { color: var(--accent-5); font-size: 1.05rem; }

        .source-link {
            display: inline-block; margin-top: 1.2em;
            font-size: 0.8rem; color: var(--text-muted); text-decoration: none;
            border-bottom: 1px dashed rgba(162, 155, 254, 0.35);
        }
        .source-link:hover { color: var(--accent-2); }

        /* ============================================================
           TABLES / BADGES / TAGS
           ============================================================ */
        .compare-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; margin-top: 1em; }
        .compare-table th {
            background: rgba(108, 92, 231, 0.15); color: var(--accent-2); font-weight: 600;
            padding: 12px 16px; text-align: left; border-bottom: 2px solid rgba(108, 92, 231, 0.3);
        }
        .compare-table td { padding: 10px 16px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); color: var(--text-secondary); vertical-align: top; }
        .compare-table tr:hover td { background: rgba(255, 255, 255, 0.02); }
        .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
        .badge.green  { background: rgba(85, 239, 196, 0.15); color: var(--accent-6); }
        .badge.purple { background: rgba(108, 92, 231, 0.15); color: var(--accent-2); }
        .badge.red    { background: rgba(253, 121, 168, 0.15); color: var(--accent-4); }
        .badge.yellow { background: rgba(255, 234, 167, 0.15); color: var(--accent-5); }
        .badge.teal   { background: rgba(0, 206, 201, 0.15); color: var(--accent-3); }
        .tag {
            display: inline-block; padding: 6px 16px; border-radius: 20px;
            font-size: 0.8rem; font-weight: 500; margin: 4px;
            background: rgba(108, 92, 231, 0.12); color: var(--accent-2); border: 1px solid rgba(108, 92, 231, 0.2);
        }
        .tags { margin-top: 1.5em; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }

        /* ============================================================
           HERO / SECTION DIVIDERS
           ============================================================ */
        .hero-title {
            font-size: 4.5rem; font-weight: 900;
            background: var(--gradient-1);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            letter-spacing: -0.03em; line-height: 1.1; margin-bottom: 0.3em;
        }
        .hero-subtitle { font-size: 1.6rem; color: var(--text-secondary); font-weight: 300; margin-bottom: 0.5em; }
        .hero-meta { font-size: 1rem; color: var(--text-muted); display: flex; gap: 24px; margin-top: 1.5em; flex-wrap: wrap; }
        .hero-meta span { display: flex; align-items: center; gap: 8px; }

        .section-number {
            font-family: 'JetBrains Mono', monospace; font-size: 1rem; letter-spacing: 0.3em;
            color: var(--accent-2); text-transform: uppercase; margin-bottom: 0.8em;
        }
        .section-icon { font-size: 4rem; margin-bottom: 0.3em; }

        .pattern-index { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-top: 1.5em; text-align: left; }
        .pattern-index .item {
            background: var(--bg-glass); border: 1px solid var(--border-glass); border-radius: var(--radius-sm);
            padding: 14px 16px; cursor: pointer; transition: var(--transition);
        }
        .pattern-index .item:hover { border-color: var(--accent-1); background: rgba(108, 92, 231, 0.12); transform: translateY(-2px); }
        .pattern-index .item strong { display: block; color: var(--text-primary); }
        .pattern-index .item span { font-size: 0.85rem; color: var(--text-muted); }

        /* ============================================================
           NAVIGATION
           ============================================================ */
        .nav-bar {
            position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 30px;
            background: rgba(10, 10, 26, 0.85); backdrop-filter: blur(15px);
            border-top: 1px solid var(--border-glass);
        }
        .nav-btn {
            width: 44px; height: 44px; border: 1px solid var(--border-glass); border-radius: 50%;
            background: var(--bg-glass); color: var(--text-primary); font-size: 1.2rem; cursor: pointer;
            transition: var(--transition); display: flex; align-items: center; justify-content: center;
        }
        .nav-btn:hover { background: rgba(108, 92, 231, 0.2); border-color: var(--accent-1); transform: scale(1.1); }
        .nav-btn:disabled { opacity: 0.3; cursor: default; transform: none; }
        .progress-bar-container { flex: 1; max-width: 700px; margin: 0 20px; display: flex; align-items: center; gap: 12px; }
        .progress-bar { flex: 1; height: 4px; background: rgba(255, 255, 255, 0.08); border-radius: 2px; overflow: hidden; }
        .progress-bar-fill { height: 100%; background: var(--gradient-1); border-radius: 2px; transition: width 0.4s ease; }
        .slide-counter { font-size: 0.85rem; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; min-width: 70px; text-align: center; }
        .section-label { font-size: 0.8rem; color: var(--accent-2); min-width: 170px; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .menu-btn { width: auto; padding: 0 16px; border-radius: 22px; font-size: 0.85rem; gap: 6px; }

        /* Índice lateral (tecla M) */
        .toc-panel {
            position: fixed; top: 0; left: 0; bottom: 0; width: 330px; z-index: 200;
            background: rgba(12, 12, 32, 0.97); border-right: 1px solid var(--border-glass);
            backdrop-filter: blur(20px); padding: 24px 18px 80px; overflow-y: auto;
            transform: translateX(-100%); transition: transform 0.35s ease;
        }
        .toc-panel.open { transform: translateX(0); box-shadow: var(--shadow-lg); }
        .toc-panel h3 { margin-bottom: 1em; }
        .toc-panel .toc-group { font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-muted); margin: 1.2em 0 0.4em; }
        .toc-panel a {
            display: block; padding: 6px 10px; border-radius: 6px; font-size: 0.9rem;
            color: var(--text-secondary); text-decoration: none; transition: var(--transition);
        }
        .toc-panel a:hover, .toc-panel a.current { background: rgba(108, 92, 231, 0.18); color: var(--text-primary); }

        /* ============================================================
           LAYOUT HELPERS
           ============================================================ */
        .two-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: start; }
        .two-cols-wide { display: grid; grid-template-columns: 1.25fr 0.75fr; gap: 24px; align-items: start; }
        .mb-1 { margin-bottom: 1em; } .mb-2 { margin-bottom: 2em; }
        .mt-1 { margin-top: 1em; }   .mt-2 { margin-top: 2em; }
        .center { text-align: center; }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(108, 92, 231, 0.3); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(108, 92, 231, 0.5); }

        .kbd-hint {
            position: fixed; top: 20px; right: 20px; z-index: 100;
            display: flex; align-items: center; gap: 8px; padding: 8px 14px;
            background: rgba(0, 0, 0, 0.4); border: 1px solid var(--border-glass); border-radius: var(--radius-sm);
            font-size: 0.75rem; color: var(--text-muted); backdrop-filter: blur(10px); opacity: 0.7; transition: opacity 0.3s ease;
        }
        .kbd-hint:hover { opacity: 1; }
        .kbd {
            display: inline-flex; align-items: center; justify-content: center; min-width: 26px; height: 24px; padding: 0 5px;
            background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 4px;
            font-size: 0.7rem; font-weight: 600;
        }
        .slide-number-badge {
            position: absolute; top: 20px; left: 30px; font-size: 0.75rem; color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace; opacity: 0.5;
        }

        @media (max-width: 900px) {
            .slide { padding: 50px 20px 90px; }
            .hero-title { font-size: 2.8rem; }
            .slide-title { font-size: 2rem; }
            .two-cols, .two-cols-wide, .cards-grid-2, .cards-grid-3, .pros-cons { grid-template-columns: 1fr; }
            .section-label { display: none; }
        }
    </style>
</head>
<body>

<div class="bg-effects">
    <div class="orb"></div>
